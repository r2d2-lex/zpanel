include:
  - template: Jobs/SAST.gitlab-ci.yml

image: python:3.13-slim

stages:
  - test
  - sonar
  - build_docker
  - release_docker
  - deploy
  - vault_test

default:
  tags:
    - zpanel-ci
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip/

build_docker_image:
  stage: build_docker
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [ "" ]
  when: manual
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH="$(printf '%s' "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHA"
      fi
      /kaniko/executor \
        --insecure-registry "$CI_REGISTRY" \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

release_docker_tag:
  stage: release_docker
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA latest
  needs:
    - build_docker_image

vault_test:
  when: manual
  image:
    name: hashicorp/vault:2.2.2
    entrypoint: [""]
  variables:
    VAULT_ADDR: "http://linuxtv:8200"
    VAULT_AUTH_ROLE: "gitlab-zpanel-role"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "http://linuxtv"
  rules:
    - if: '$CI_COMMIT_BRANCH == "cicd"'
  script:
    - printf 'VAULT_ADDR=%s\n' "$VAULT_ADDR"
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$VAULT_AUTH_ROLE" jwt="$VAULT_ID_TOKEN")"
    - export DEMO_PASSWORD="$(vault kv get -field=password gitlab-kv/zpanel/ci/api)"
    - test -n "$DEMO_PASSWORD"
    - printf 'DEMO_PASSWORD=%s\n' "$DEMO_PASSWORD"

python-checks:
  stage: test
  tags:
    - zpanel-ci
  variables:
    PIP_INDEX_URL: "$NEXUS_PIP"
  script:
    - python --version
    - python -m pip install --upgrade pip
    - |
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
        pip install sqlalchemy[asyncio]
      fi
    - |
      if [ -f requirements-dev.txt ]; then
        pip install -r requirements-dev.txt
      fi
    - python -m compileall -q .
    - python -m pytest -q --junitxml=report.xml
  rules:
    - changes:
        - app/**/*
        - tests/**/*
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml

sonarqube-check:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  tags:
    - zpanel-ci
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
  - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
      changes:
        - app/**/*
    - if: $CI_COMMIT_BRANCH == 'cicd'
      changes:
        - app/**/*

deploy-host:
  stage: deploy
  image: alpine:3.22
  resource_group: zpanel-production
  environment:
    name: production-host
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - install -m 600 "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - |
      rsync -az --delete \
        --exclude='.git/' \
        --exclude='venv/' \
        --exclude='app/static/images/' \
        ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "cd '$DEPLOY_PATH' &&
         python3 -m venv venv &&
         venv/bin/pip install --upgrade pip &&
         venv/bin/pip install -r requirements.txt gunicorn 'sqlalchemy[asyncio]' &&
         sudo systemctl restart zpanel.service"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
    - if: $CI_COMMIT_BRANCH == 'cicd'
      when: manual
